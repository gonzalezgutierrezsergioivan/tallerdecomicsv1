<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taller de Cómics</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6eaff;--ink:#16161d;--card:#fff;--acc:#ff3d7f;--sun:#ffd23f;--mut:#5b5b6b;--bd:#16161d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14141d;--ink:#f3f3f8;--card:#22222f;--mut:#a5a5b8;--bd:#f3f3f8}}
:root[data-theme="dark"]{--bg:#14141d;--ink:#f3f3f8;--card:#22222f;--mut:#a5a5b8;--bd:#f3f3f8}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;background-image:radial-gradient(#7d86c744 1.3px,transparent 1.4px);background-size:12px 12px}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 16px;background:var(--sun);color:#16161d;border-bottom:4px solid #16161d}
h1{font:400 34px/1 Bangers,'Comic Sans MS',cursive;margin:0;letter-spacing:1px;text-shadow:2px 2px 0 #fff}
.tb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
button{font:inherit;cursor:pointer;border:2.5px solid var(--bd);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 11px;box-shadow:2px 2px 0 var(--bd)}
button:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--bd)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.pri{background:var(--acc);color:#fff}
header label{display:flex;gap:6px;align-items:center;font-weight:600}
input[type=color]{width:34px;height:30px;padding:1px;border:2.5px solid var(--bd);border-radius:6px;background:var(--card);cursor:pointer}
.app{display:grid;grid-template-columns:250px 1fr 230px;gap:14px;padding:14px;align-items:start}
aside{background:var(--card);border:3px solid var(--bd);border-radius:12px;padding:10px;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;padding:6px 2px;font-weight:700}
.tabs button.on{background:var(--acc);color:#fff}
#it{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#it button{padding:3px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;box-shadow:none;border-width:2px;line-height:1.1}
#it svg{width:100%;height:auto;aspect-ratio:1;background:#fff;border-radius:5px}
#pn{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pn{margin:0;border:5px solid #16161d;background:#fff;box-shadow:6px 6px 0 var(--bd);position:relative;opacity:.85}
.pn.on{opacity:1;outline:4px solid var(--acc);outline-offset:3px}
.pn svg{display:block;width:100%;height:auto;touch-action:none;user-select:none}
.pn figcaption{position:absolute;left:0;top:0;background:#16161d;color:#fff;font:400 16px Bangers,cursive;padding:1px 8px;pointer-events:none}
#pr h2{font:400 22px Bangers,cursive;margin:0 0 8px;letter-spacing:.5px}
#pr .r{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;font-weight:600;font-size:13px}
#pr .r span{color:var(--mut);font-weight:400}
#pr input[type=range]{width:100%;accent-color:var(--acc)}
#pr textarea{width:100%;font:inherit;border:2.5px solid var(--bd);border-radius:6px;padding:5px;background:var(--card);color:var(--ink);resize:vertical}
.bs{display:grid;grid-template-columns:1fr 1fr;gap:6px}.bs button{font-size:12px;padding:5px 3px}
.del{color:#e11d48}
.hint{color:var(--mut);font-size:13px;margin:0}
@media(max-width:1000px){.app{grid-template-columns:1fr}aside{position:static;max-height:none}#it{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}}
</style></head><body>
<header>
<h1>Taller de Cómics</h1>
<div class="tb">
<button id="add" class="pri">+ Cuadro <span id="cnt"></span></button>
<button id="rm">Quitar cuadro</button>
<button id="clr">Vaciar cuadro</button>
<label>Fondo del cuadro <input type="color" id="pbg" aria-label="Color de fondo del cuadro"></label>
</div></header>
<main class="app">
<aside id="lib"><div class="tabs" id="tabs"></div><div id="it"></div></aside>
<section id="pn" aria-label="Cuadros del cómic"></section>
<aside id="pr">
<p class="hint" id="emp">Toca un elemento dentro de un cuadro para moverlo y editarlo. Arrástralo para cambiar su posición.</p>
<div id="ed" hidden>
<h2 id="tt"></h2>
<div class="r" id="rtx"><label for="txt">Texto</label><textarea id="txt" rows="3" maxlength="80"></textarea></div>
<div class="r"><label for="c1" id="l1"></label><input type="color" id="c1"></div>
<div class="r" id="r2"><label for="c2" id="l2"></label><input type="color" id="c2"></div>
<div class="r"><label for="sz">Tamaño</label><input type="range" id="sz" min="0.2" max="5" step="0.05"></div>
<div class="r"><label for="rt">Rotación</label><input type="range" id="rt" min="-180" max="180" step="1"></div>
<div class="bs">
<button id="fl">Voltear</button><button id="dp">Duplicar</button>
<button id="fr">Al frente</button><button id="bk">Al fondo</button>
<button id="dl" class="del" style="grid-column:span 2">Eliminar</button>
</div></div>
</aside>
</main>

const tf=e=>`translate(${e.x} ${e.y}) rotate(${e.r}) scale(${e.s*e.fx} ${e.s})`;

function mk(k){const d=T[k],fixed=d.y!=null,j=fixed?0:Math.round(Math.random()*40-20);

function render(){
$('#pn').innerHTML=panels.map((p,i)=>`<figure class="pn ${i==act?'on':''}" data-i="${i}"><svg viewBox="0 0 300 300" role="img" aria-label="Cuadro ${i+1}"><defs><clipPath id="c${i}"><rect width="300" height="300"/></clipPath></defs><g clip-path="url(#c${i})"><rect width="300" height="300" fill="${p.bg}"/>${p.els.map(e=>`<g data-id="${e.id}" transform="${tf(e)}" style="cursor:move">${draw(e.t,e.a,e.b,e.txt)}</g>`).join('')}</g></svg><figcaption>${i+1}</figcaption></figure>`).join('');
const e=cur(),g=e&&document.querySelector(`.pn.on g[data-id="${e.id}"]`);
if(g){const b=g.getBBox();g.insertAdjacentHTML('beforeend',`<rect x="${b.x-2}" y="${b.y-2}" width="${b.width+4}" height="${b.height+4}" fill="none" stroke="#ff3d7f" stroke-width="2" stroke-dasharray="5 3" vector-effect="non-scaling-stroke" pointer-events="none"/>`)}
$('#cnt').textContent=panels.length+'/6';$('#add').disabled=panels.length>=6;$('#rm').disabled=panels.length<=1;}
function ui(){const e=cur();$('#emp').hidden=!!e;$('#ed').hidden=!e;$('#pbg').value=panels[act].bg;if(!e)return;
const d=T[e.t];$('#tt').textContent=d.n;$('#rtx').hidden=d.c!='t';$('#txt').value=e.txt||'';
$('#l1').textContent=d.l[0];$('#c1').value=e.a;$('#r2').hidden=!d.l[1];if(d.l[1]){$('#l2').textContent=d.l[1];$('#c2').value=e.b}
$('#sz').value=e.s;$('#rt').value=e.r;$('#fl').hidden=d.c=='t'}
function tabs(){$('#tabs').innerHTML=Object.entries(CATS).map(([k,v])=>`<button class="${k==cat?'on':''}" data-c="${k}">${v}</button>`).join('');
$('#it').innerHTML=Object.entries(T).filter(([,d])=>d.c==cat).map(([k,d])=>`<button data-k="${k}" title="${d.n}"><svg viewBox="-56 -56 112 112" overflow="hidden">${draw(k,d.a,d.b||'#000',d.txt)}</svg>${d.n}</button>`).join('')}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){cat=b.dataset.c;tabs()}};
$('#it').onclick=e=>{const b=e.target.closest('button');if(b)add(b.dataset.k)};
const pos=(ev,svg)=>{const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
$('#pn').addEventListener('pointerdown',ev=>{const f=ev.target.closest('.pn');if(!f)return;
act=+f.dataset.i;const g=ev.target.closest('g[data-id]');sel=g?+g.dataset.id:null;render();ui();if(!g)return;
const svg=document.querySelector(`.pn[data-i="${act}"] svg`),e=cur(),node=svg.querySelector(`g[data-id="${e.id}"]`),p0=pos(ev,svg),ox=e.x-p0.x,oy=e.y-p0.y;
drag=m=>{const q=pos(m,svg);e.x=Math.round(q.x+ox);e.y=Math.round(q.y+oy);node.setAttribute('transform',tf(e))};ev.preventDefault()});
addEventListener('pointermove',m=>drag&&drag(m));
addEventListener('pointerup',()=>{drag=null});
const upd=(k,v)=>{const e=cur();if(e){e[k]=v;render()}};
$('#c1').oninput=e=>upd('a',e.target.value);$('#c2').oninput=e=>upd('b',e.target.value);
$('#sz').oninput=e=>upd('s',+e.target.value);$('#rt').oninput=e=>upd('r',+e.target.value);
$('#txt').oninput=e=>upd('txt',e.target.value);
$('#fl').onclick=()=>{const e=cur();if(e){e.fx*=-1;render()}};
$('#fr').onclick=()=>{const p=panels[act],e=cur();if(e){p.els.push(p.els.splice(p.els.indexOf(e),1)[0]);render()}};
$('#bk').onclick=()=>{const p=panels[act],e=cur();if(e){p.els.unshift(p.els.splice(p.els.indexOf(e),1)[0]);render()}};
$('#dp').onclick=()=>{const p=panels[act],e=cur();if(e){const c={...e,id:++uid,x:e.x+15,y:e.y+15};p.els.splice(p.els.indexOf(e)+1,0,c);sel=c.id;render()}};
const del=()=>{const p=panels[act],e=cur();if(e){p.els.splice(p.els.indexOf(e),1);sel=null;render();ui()}};
$('#dl').onclick=del;
addEventListener('keydown',e=>{if(e.key=='Delete'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))del()});
$('#pbg').oninput=e=>{panels[act].bg=e.target.value;render()};
$('#add').onclick=()=>{if(panels.length<6){panels.push({bg:'#ffffff',els:[]});act=panels.length-1;sel=null;render();ui()}};
$('#rm').onclick=()=>{if(panels.length>1){panels.splice(act,1);act=Math.max(0,act-1);sel=null;render();ui()}};
$('#clr').onclick=()=>{panels[act].els=[];sel=null;render();ui()};
panels=[{bg:'#ffffff',els:[]}];tabs();
['fondo','suelo','sol','persona','globo'].forEach(k=>{add(k);const e=cur();if(k=='sol'){e.x=235;e.y=55;e.s=.8}if(k=='persona'){e.x=110;e.y=185;e.s=1.5}if(k=='globo'){e.x=175;e.y=70;e.s=1.05;e.txt='¡Hola,\nmundo!'}});
sel=null;render();ui();
</script></body></html>
